<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro</h1>

  <form id="formCadastro">

    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Digite seu nome">

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seuemail@exemplo.com">

    <label for="idade">Idade</label>
    <input type="number" id="idade" placeholder="Ex: 20">

    <label>Sexo</label>
    <div class="radio-group">
      <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
      <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
    </div>

    <label>Interesses</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="interesse" value="esportes"> Esportes</label>
      <label><input type="checkbox" name="interesse" value="musica"> Música</label>
      <label><input type="checkbox" name="interesse" value="jogos"> Jogos</label>
    </div>

    <label for="mensagem-texto">Mensagem (máx. 100 caracteres)</label>
    <textarea id="mensagem-texto" maxlength="100"></textarea>
    <div id="contador">0 / 100 caracteres</div>

    <button type="submit">Enviar cadastro</button>
  </form>

  <div id="mensagem"></div>
<script src="script.js"></script>
</body>
</html>
